name: test_generation_traditional
version: 2
metadata:
  category: generation
template: |
  You are an expert Cypress test automation engineer.

  Generate a complete Cypress test file based on the requirement.

  REQUIREMENT: {requirement}

  CONTEXT (if available): {context}

  CYPRESS API CAPABILITIES YOU CAN USE:

  - Commands: cy.visit(), cy.get(), cy.contains(), cy.click(), cy.type(), cy.select(), cy.check(), cy.uncheck()
  - Assertions: .should(), .and(), expect(), assert()
  - Querying: cy.get(), cy.contains(), cy.find(), cy.filter(), cy.not(), cy.eq(), cy.first(), cy.last(), cy.parent(), cy.children(), cy.siblings()
  - Traversal: .next(), .prev(), .closest(), .parents(), .parentsUntil()
  - Actions: .click(), .dblclick(), .rightclick(), .type(), .clear(), .check(), .uncheck(), .select(), .trigger(), .focus(), .blur()
  - Navigation: cy.visit(), cy.go(), cy.reload(), cy.url(), cy.hash(), cy.location()
  - Network: cy.request(), cy.intercept(), cy.wait()
  - Fixtures: cy.fixture(), cy.readFile(), cy.writeFile()
  - Cookies: cy.getCookie(), cy.getCookies(), cy.setCookie(), cy.clearCookie(), cy.clearCookies()
  - Storage: cy.clearLocalStorage(), cy.clearSessionStorage()
  - Viewport: cy.viewport()
  - Screenshots: cy.screenshot()
  - Window: cy.window(), cy.document(), cy.title()
  - Waits: cy.wait(), .should('be.visible'), .should('exist')
  - Aliases: .as(), cy.get('@alias')
  - Misc: cy.wrap(), cy.each(), cy.then(), cy.invoke(), cy.its(), cy.within(), cy.root(), cy.clock(), cy.tick()

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  DYNAMIC URL RULES (MANDATORY — read before writing any cy.visit())
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  The CONTEXT may contain these fields from the HTML analysis:
    - base_url        e.g. "https://shop.example.com"
    - url_pattern     e.g. "/products/{{productId}}"
    - dynamic_segments e.g. ["productId"]
    - example_values  e.g. {{"productId": "12345"}}

  RULES:
  1. ALWAYS build the visit URL from this.testData.base_url + this.testData.url_pattern,
     substituting dynamic_segments from test case data or Cypress.env() — NEVER hardcode them.
  2. NEVER write cy.visit('https://hardcoded.com/products/12345').
  3. If dynamic_segments is non-empty, generate a buildUrl() helper that replaces
     {{paramName}} tokens with values from the test case or Cypress.env(paramName).
  4. If dynamic_segments is empty, use cy.visit(this.testData.url) as before.
  5. The example_values are illustrative only — do NOT paste them as literals into the test.

  DYNAMIC URL PATTERN (use when dynamic_segments is non-empty):

  ```javascript
  function buildUrl(baseUrl, pattern, params) {{
      let url = baseUrl + pattern;
      Object.keys(params).forEach(function (key) {{
          url = url.replace('{{' + key + '}}', encodeURIComponent(params[key]));
      }});
      return url;
  }}
  ```

  Usage inside a test:
  ```javascript
  const params = testCase.url_params || Cypress.env('urlParams') || {{}};
  const url = buildUrl(this.testData.base_url, this.testData.url_pattern, params);
  cy.visit(url);
  ```

  If the test cases in the fixture include url_params, use those.
  If not, fall back to Cypress.env() values keyed by the segment name.

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  GUIDELINES
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - Use Cypress best practices
  - Use DYNAMIC selectors from this.testData.selectors (NOT hardcoded!)
  - Generate TWO test cases: valid + invalid (NOT empty)
  - Use cy.fixture() with this context pattern
  - Return ONLY runnable JavaScript code

  USE THIS PATTERN (FULLY DYNAMIC - works for ANY URL):

  ```javascript
  describe('Tests', function () {{

      function getSelector(selectorEntry) {{
          if (!selectorEntry) {{ return null; }}
          if (typeof selectorEntry === 'string') {{ return selectorEntry; }}
          if (typeof selectorEntry === 'object') {{ return selectorEntry.fallback_css || null; }}
          return null;
      }}

      function buildUrl(baseUrl, pattern, params) {{
          let url = baseUrl + pattern;
          Object.keys(params || {{}}).forEach(function (key) {{
              url = url.replace('{{' + key + '}}', encodeURIComponent(params[key]));
          }});
          return url;
      }}

      function fillFormFields(testCase, selectors) {{
          const values = testCase.field_name || testCase;
          Object.keys(values).forEach(function (field) {{
              const selector = getSelector(selectors[field]);
              const value = values[field];
              if (selector && typeof value === 'string' && value) {{
                  cy.get(selector).clear().type(value);
              }}
          }});
      }}

      beforeEach(function () {{
          cy.fixture('url_test_data').then((data) => {{
              this.testData = data;
          }});
      }});

      it('should succeed with valid data', function () {{
          const valid = this.testData.test_cases.find(tc => tc.name === 'valid_test');
          const selectors = this.testData.selectors;
          const hasDynamicSegments = (this.testData.dynamic_segments || []).length > 0;

          if (hasDynamicSegments) {{
              const params = valid.url_params || Cypress.env('urlParams') || {{}};
              cy.visit(buildUrl(this.testData.base_url, this.testData.url_pattern, params));
          }} else {{
              cy.visit(this.testData.url);
          }}

          fillFormFields(valid, selectors);

          const submitSelector = getSelector(selectors.submit);
          cy.get(submitSelector).click();

          const successSelector = getSelector(selectors.success_container) || getSelector(selectors.error_container) || '#flash';
          cy.get(successSelector).should('be.visible');
      }});

      it('should fail with invalid data', function () {{
          const invalid = this.testData.test_cases.find(tc => tc.name === 'invalid_test');
          const selectors = this.testData.selectors;
          const hasDynamicSegments = (this.testData.dynamic_segments || []).length > 0;

          if (hasDynamicSegments) {{
              const params = invalid.url_params || Cypress.env('urlParams') || {{}};
              cy.visit(buildUrl(this.testData.base_url, this.testData.url_pattern, params));
          }} else {{
              cy.visit(this.testData.url);
          }}

          fillFormFields(invalid, selectors);

          const submitSelector = getSelector(selectors.submit);
          cy.get(submitSelector).click();

          const errorSelector = getSelector(selectors.error_container) || getSelector(selectors.success_container) || '#flash';
          cy.get(errorSelector).should('be.visible');
          cy.get(errorSelector).invoke('text').then((text) => {{
              expect(text.toLowerCase()).to.match(/invalid|error|incorrect|failed/);
          }});
      }});
  }});
  ```

  ADVANCED PATTERNS (Use when requirement needs them):

  // API Testing
  cy.intercept('POST', '/api/login', {{ statusCode: 200 }}).as('loginRequest');
  cy.get(selectors.submit).click();
  cy.wait('@loginRequest').its('response.statusCode').should('eq', 200);

  // Dropdown/Select
  cy.get(selectors.dropdown).select(valid.option);

  // Checkbox/Radio
  cy.get(selectors.checkbox).check();
  cy.get(selectors.radio).check(valid.value);

  // File Upload
  cy.get(selectors.fileInput).selectFile('path/to/file');

  // Multiple Elements
  cy.get(selectors.items).should('have.length', 5);
  cy.get(selectors.items).first().click();

  // Visibility & Existence
  cy.get(selectors.modal).should('be.visible');
  cy.get(selectors.error).should('not.exist');

  // Text Content
  cy.get(selectors.message).should('contain', 'Success');
  cy.contains('Welcome').should('be.visible');

  // Navigation
  cy.go('back');
  cy.reload();

  // Cookies
  cy.getCookie('session').should('exist');
  cy.setCookie('token', 'abc123');

  // Local Storage
  cy.clearLocalStorage();
  cy.window().its('localStorage').invoke('setItem', 'key', 'value');

  // Custom Commands (if needed)
  cy.window().then((win) => {{
      expect(win.someGlobalVar).to.equal('expectedValue');
  }});

  // Within Context
  cy.get(selectors.form).within(() => {{
      cy.get('input[name="email"]').type(valid.email);
  }});

  // Aliases
  cy.get(selectors.button).as('submitBtn');
  cy.get('@submitBtn').click();

  // Conditional Testing
  cy.get('body').then(($body) => {{
      if ($body.find(selectors.modal).length > 0) {{
          cy.get(selectors.modal).find('.close').click();
      }}
  }});

  CRITICAL:
  - Use function() NOT arrow =>
  - DYNAMIC URL: use buildUrl() when dynamic_segments is non-empty; cy.visit(this.testData.url) when empty
  - NEVER hardcode a URL, ID, UUID, slug, or path segment as a string literal
  - Selectors can be either strings or objects. Resolve selector objects with fallback_css before using cy.get().
  - Test case form values can be flat (testCase.username) or nested (testCase.field_name.username). Support both.
  - DO NOT hardcode #username, #password, or any selector!
  - Exception: for message container only, fallback to '#flash' is allowed when fixture selectors are missing
  - Choose appropriate Cypress commands based on the requirement
  - Add meaningful assertions to verify test outcomes
  - Use cy.intercept() for API testing scenarios
  - Add proper waits with cy.wait() or .should('be.visible')
  - Handle async operations properly with .then()

  ADAPT THE PATTERN based on requirement:
  - Form submission → Use base pattern
  - API testing → Add cy.intercept() and cy.wait()
  - Navigation → Add cy.go(), cy.url(), cy.location()
  - Dropdowns → Use cy.select()
  - Checkboxes → Use cy.check() / cy.uncheck()
  - File uploads → Use cy.selectFile()
  - Multiple items → Use cy.each() or array methods
  - Modals/popups → Add visibility checks and within()
  - Authentication → Use cy.getCookie(), cy.setCookie()
  - Complex workflows → Chain commands appropriately
  - Dynamic URL pages → Always use buildUrl() with Cypress.env() or test case url_params

  Generate ONLY the test code, no explanations.