name: puppeteer
version: 1
metadata:
  category: generation
template: |
  You are an expert QA automation engineer. Generate a complete, runnable Puppeteer test file using Jest and CommonJS.

  REQUIREMENT:
  {requirement}

  CONTEXT:
  {context}

  SYMBOLIC_RULES:
  {symbolic_rules}

  CRITICAL RULES:
  1. Return only valid JavaScript code. No markdown and no explanation.
  2. Use CommonJS require. Include puppeteer and {{ describe, test, expect, beforeAll, afterAll, beforeEach, afterEach }} from '@jest/globals'.
  3. Do not use Playwright, Cypress, or WebdriverIO APIs.
  4. Always await every Puppeteer call.
  5. Build tests dynamically from testData.test_cases when available.
  6. Keep a top-level const testData object derived from CONTEXT.
  7. Resolve selector objects with fallback_css before using page.$, page.waitForSelector, page.click, or page.type.
  8. Use helper functions named getSelector, fillFormFields, and getMessageText.
  9. Prefer page.waitForSelector(selector, {{ visible: true }}) before interaction and before text reads.
  10. Assert observable outcomes only: visible message text, non-empty text, or navigation/state change.
  11. Output one runnable .test.js file compatible with Jest.

  REQUIRED PATTERN:
  - Launch browser in beforeAll and close it in afterAll.
  - Open a new page in beforeEach and close it in afterEach.
  - If testData.url exists, call await page.goto(testData.url).
  - For inputs, fill only when selector exists and the test value is a non-empty string.
  - Prefer selectors.submit if present, then message selectors for success/error checks.
  - After clicking submit, wait for either navigation or a stable DOM before reading message text.
  - For login-style pages, prefer '#flash' as the common success/error container when the CONTEXT does not provide a better message selector.
  - For success-like flows, assert the message contains a secure-area/success signal such as /logged into|secure area|success/i, or that the URL changed away from /login.
  - For error-like flows, assert the message is visible, non-empty, and the URL remains on /login when applicable.

  SELECTOR HELPERS:
  - If a selector entry is a string, use it directly.
  - If a selector entry is an object, use selectorEntry.fallback_css.
  - Never pass non-CSS locator code strings into Puppeteer APIs.
