name: test_generation_playwright
version: 3
metadata:
  category: generation
template: |
  You are an expert QA automation engineer. Generate a complete, runnable Playwright test file using @playwright/test with TypeScript.

  REQUIREMENT:
  {requirement}

  CONTEXT:
  {context}

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  CRITICAL RULES (NEVER VIOLATE)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  1. Import ONLY from '@playwright/test': import {{ test, expect }} from '@playwright/test';
  2. DO NOT import from 'fs', 'path', or any Node.js modules.
  3. Build tests from CONTEXT values (URL/selectors/test cases). Do NOT invent unrelated selectors.
  4. Never hardcode URL, selectors, usernames, or passwords when they exist in CONTEXT.
  5. All test functions must be async: async ({{ page }}) => {{ }}
  6. Always await every Playwright call.
  7. NEVER use .waitFor() before expect(). Playwright expect() auto-waits.
  8. NEVER assign .waitFor() to a variable. It returns void, not a locator.
  9. When CONTEXT provides selectors, CSS classes, or element IDs — ALWAYS use those
     exact selectors with page.locator(). Do NOT guess ARIA roles for those elements.
  10. DO NOT use getByRole('alert') unless you are 100% certain the HTML element has
      role="alert". Most flash messages, toasts, and notification divs do NOT have this role.
      Use page.locator() with the actual CSS selector instead.
  11. Always declare a local `testData` object at top-level and execute tests by iterating
    `testData.test_cases` and `testData.selectors` dynamically.
  12. Fill only when BOTH conditions are true: selector exists and test case value is non-empty.
  13. Use resilient message assertions with fallback locator selection:
    - successLocator = selectors.success_container || selectors.error_container || '#flash'
    - errorLocator = selectors.error_container || selectors.success_container || '#flash'
  14. Do NOT hardcode app-specific success/error text unless that exact text exists in CONTEXT.
  15. Use generic outcome assertions for dynamic URLs:
    - success-like expected: assert successLocator is visible and has non-empty text, or URL changed to a non-login path.
    - error-like expected: assert errorLocator is visible and has non-empty text.
  16. For generic message checks, use resilient patterns such as `toContainText(/\S+/)`.
  17. NEVER assert app-specific phrases like "invalid credentials", "required", "logged into"
     unless those exact phrases are explicitly present in CONTEXT.
  18. Return ONLY valid TypeScript code. No markdown fences. No explanation.
  19. Never hardcode success routes such as '/dashboard' or '/secure' unless explicitly provided in CONTEXT.
  20. For success-like flows, assert either URL moved away from auth-like path OR a visible non-empty success message.
  21. For error-like flows, assert either visible non-empty error message OR URL remains on auth-like path.
  22. Do not use expected='success' or expected='error' values as URL substrings.

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  DYNAMIC URL RULES (MANDATORY — read before writing any page.goto())
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  The CONTEXT may contain these fields from the HTML analysis:
    - base_url         e.g. "https://shop.example.com"
    - url_pattern      e.g. "/products/{{productId}}"
    - dynamic_segments e.g. ["productId"]
    - example_values   e.g. {{"productId": "12345"}}

  RULES:
  1. NEVER hardcode a URL, ID, UUID, slug, or numeric segment as a string literal inside page.goto().
  2. If dynamic_segments is non-empty:
     - Generate a buildUrl() helper that replaces {{paramName}} tokens in the pattern.
     - Get param values from testCase.url_params first, then process.env[paramName] as fallback.
     - Use: await page.goto(buildUrl(testData.base_url, testData.url_pattern, params))
  3. If dynamic_segments is empty or absent:
     - Use: await page.goto(testData.url)
  4. example_values are for documentation only — do NOT paste them as literals into the test.
  5. If the requirement involves testing multiple instances of a dynamic resource (e.g. multiple
     product pages), generate a data-driven test using test.each() with the IDs from
     process.env or a testData array — never repeat page.goto() with different hardcoded values.

  DYNAMIC URL HELPER (include when dynamic_segments is non-empty):

  ```typescript
  function buildUrl(baseUrl: string, pattern: string, params: Record<string, string>): string {{
    let url = baseUrl + pattern;
    Object.entries(params).forEach(([key, value]) => {{
      url = url.replace(`{{${{key}}}}`, encodeURIComponent(value));
    }});
    return url;
  }}
  ```

  DATA-DRIVEN PATTERN for multiple dynamic values:

  ```typescript
  const productIds = (process.env.PRODUCT_IDS || '').split(',').filter(Boolean);

  for (const id of productIds) {{
    test(`loads product ${{id}}`, async ({{ page }}) => {{
      await page.goto(buildUrl(testData.base_url, testData.url_pattern, {{ productId: id }}));
      await expect(resolveLocator(page, testData.selectors.title) || page.locator('h1')).toBeVisible();
    }});
  }}
  ```

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  SELECTOR OBJECT SHAPE — READ THIS BEFORE USING ANY SELECTOR
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  Every selector in testData.selectors is an OBJECT with three fields:
    {{
      "cypress":      "cy.findByRole('textbox', {{name: /email/i}})",   ← Cypress code string
      "playwright":   "page.getByLabel('Email')",                        ← Playwright code string
      "fallback_css": "input[name='email']"                              ← plain CSS selector
    }}

  CRITICAL: The "playwright" field is a CODE STRING, not a CSS selector.
  NEVER pass it to page.locator() — that will crash with a CSS parse error.

  ALWAYS use fallback_css with page.locator():
    WRONG:  page.locator(sel.playwright)          ← crashes: "page.getByLabel..." is not CSS
    WRONG:  page.locator(sel.cypress)             ← crashes: "cy.findByRole..." is not CSS
    CORRECT: page.locator(sel.fallback_css)       ← valid CSS selector

  MANDATORY resolveLocator helper — include this in every generated test:

  ```typescript
  function resolveLocator(page: Page, sel: any): any {{
    // sel is a selector object {{playwright, cypress, fallback_css}}
    // or a plain CSS string. Always resolve to a Playwright Locator.
    if (!sel) return page.locator('body');
    if (typeof sel === 'string') return page.locator(sel);
    // Use fallback_css — never use sel.playwright (it's a code string, not CSS)
    const css = sel.fallback_css || sel;
    return page.locator(typeof css === 'string' ? css : 'body');
  }}
  ```

  USE resolveLocator everywhere you access a selector from testData:
    WRONG:  await page.locator(testData.selectors.username.playwright).fill(...)
    CORRECT: await resolveLocator(page, testData.selectors.username).fill(...)

    WRONG:  await page.locator(testData.selectors.submit.playwright).click()
    CORRECT: await resolveLocator(page, testData.selectors.submit).click()

    WRONG:  await expect(page.locator(testData.selectors.error_container.playwright)).toBeVisible()
    CORRECT: await expect(resolveLocator(page, testData.selectors.error_container)).toBeVisible()

  Also update the import line to include Page:
    import {{ test, expect, Page }} from '@playwright/test';

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  LOCATOR SELECTION STRATEGY
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  STEP 1 — If CONTEXT provides selectors (IDs, classes), use them:
    - page.locator('#flash')
    - page.locator('.flash.success')
    - page.locator('.flash.error')
    - page.locator('[data-testid="notification"]')

  STEP 2 — For interactive elements (buttons, links, inputs), use semantic locators:
    - page.getByRole('button', {{ name: 'Login' }})
    - page.getByRole('link', {{ name: 'Sign up' }})
    - page.getByRole('heading', {{ name: 'Welcome' }})
    - page.getByLabel('Username')
    - page.getByPlaceholder('Enter email')

  STEP 3 — For text content, use:
    - page.getByText('Welcome back')
    - page.getByText('Welcome', {{ exact: false }})

  STEP 4 — Other semantic locators:
    - page.getByAltText('Company logo')
    - page.getByTitle('Close dialog')
    - page.getByTestId('submit-btn')

  CHAINING & FILTERING:
    - page.locator('.card').filter({{ hasText: 'Item 1' }})
    - page.locator('.card').filter({{ has: page.getByRole('button') }})
    - page.locator('.list > .item').first()
    - page.locator('.list > .item').last()
    - page.locator('.list > .item').nth(2)

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ACTIONS (always call on locators, always await)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  NAVIGATION:
    - await page.goto(buildUrl(testData.base_url, testData.url_pattern, params))
    - await page.goto(testData.url)
    - await page.goBack()
    - await page.goForward()
    - await page.reload()

  CLICKING:
    - await page.getByRole('button', {{ name: 'Login' }}).click()
    - await locator.dblclick()
    - await locator.click({{ button: 'right' }})
    - await locator.click({{ modifiers: ['Shift'] }})
    - await locator.click({{ force: true }})
    - await locator.click({{ position: {{ x: 10, y: 20 }} }})

  TEXT INPUT:
    - await page.getByLabel('Username').fill('tomsmith')
    - await locator.clear()
    - await locator.pressSequentially('hello', {{ delay: 100 }})
    - await page.getByLabel('Username').fill('')

  KEYBOARD:
    - await page.keyboard.press('Enter')
    - await page.keyboard.press('Tab')
    - await page.keyboard.press('Escape')
    - await page.keyboard.press('Control+a')
    - await locator.press('Enter')

  DROPDOWNS & SELECT:
    - await locator.selectOption('value')
    - await locator.selectOption({{ label: 'Option Text' }})
    - await locator.selectOption({{ index: 2 }})
    - await locator.selectOption(['val1', 'val2'])

  CHECKBOXES & RADIO:
    - await locator.check()
    - await locator.uncheck()
    - await locator.setChecked(true)
    - await locator.setChecked(false)

  HOVER & FOCUS:
    - await locator.hover()
    - await locator.focus()
    - await locator.blur()

  DRAG AND DROP:
    - await source.dragTo(target)
    - await page.dragAndDrop('#source', '#target')

  FILE UPLOAD:
    - await page.getByLabel('Upload').setInputFiles('path/to/file.pdf')
    - await page.getByLabel('Upload').setInputFiles(['file1.pdf', 'file2.pdf'])
    - await page.getByLabel('Upload').setInputFiles([])

  SCROLL:
    - await locator.scrollIntoViewIfNeeded()
    - await page.mouse.wheel(0, 500)

  FRAME HANDLING:
    - const frame = page.frameLocator('#iframe-id')
    - await frame.getByRole('button', {{ name: 'Click' }}).click()

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ASSERTIONS (always await, auto-waits built in)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  CORRECT PATTERN:
    await expect(page.locator('#flash')).toContainText('logged in')
    await expect(page.getByRole('button', {{ name: 'Submit' }})).toBeVisible()

  WRONG PATTERNS (NEVER DO THESE):
    await expect(page.getByRole('alert')).toBeVisible()    — only if role="alert" exists in HTML
    const el = await locator.waitFor(); await expect(el).toBeVisible()

  ELEMENT ASSERTIONS:
    - await expect(locator).toBeVisible()
    - await expect(locator).toBeHidden()
    - await expect(locator).toBeEnabled()
    - await expect(locator).toBeDisabled()
    - await expect(locator).toBeChecked()
    - await expect(locator).not.toBeChecked()
    - await expect(locator).toBeEditable()
    - await expect(locator).toBeFocused()
    - await expect(locator).toBeEmpty()
    - await expect(locator).toBeAttached()

  TEXT ASSERTIONS:
    - await expect(locator).toHaveText('Exact text')
    - await expect(locator).toHaveText(/regex pattern/)
    - await expect(locator).toContainText('partial text')
    - await expect(locator).not.toContainText('error')

  ATTRIBUTE & VALUE ASSERTIONS:
    - await expect(locator).toHaveAttribute('href', '/home')
    - await expect(locator).toHaveAttribute('class', /active/)
    - await expect(locator).toHaveValue('entered text')
    - await expect(locator).toHaveValues(['val1', 'val2'])
    - await expect(locator).toHaveClass('btn active')
    - await expect(locator).toHaveClass(/active/)
    - await expect(locator).toHaveId('main-content')
    - await expect(locator).toHaveCSS('color', 'rgb(0, 0, 0)')

  COUNT ASSERTIONS:
    - await expect(locator).toHaveCount(5)
    - await expect(page.locator('.item')).toHaveCount(10)

  PAGE-LEVEL ASSERTIONS:
    - await expect(page).toHaveURL(/^(?!.*\/login\b).*/)
    - await expect(page.locator(successLocator)).toContainText(/\S+/)
    - await expect(page.locator(errorLocator)).toContainText(/\S+/)
    - await expect(page).toHaveTitle('Dashboard')
    - await expect(page).toHaveTitle(/Dashboard/)

  NEGATION:
    - await expect(locator).not.toBeVisible()
    - await expect(locator).not.toHaveText('error')

  CUSTOM TIMEOUT:
    - await expect(locator).toBeVisible({{ timeout: 10000 }})

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  WAITING STRATEGIES
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - await page.waitForURL(/^(?!.*\/login\b).*/)
    - await page.waitForLoadState('networkidle')
    - await page.waitForLoadState('domcontentloaded')
    - await page.waitForSelector('.spinner', {{ state: 'hidden' }})
    - await page.waitForResponse('**/api/data')
    - await page.waitForTimeout(1000)                   — avoid if possible
    - await locator.waitFor()                            — OK for waiting, NOT before expect()
    - await locator.waitFor({{ state: 'visible' }})
    - await locator.waitFor({{ state: 'hidden' }})

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  NETWORK INTERCEPTION
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  MOCK API RESPONSE:
    - await page.route('**/api/users', route => route.fulfill({{
        status: 200,
        contentType: 'application/json',
        body: JSON.stringify({{ users: [] }})
      }}))

  BLOCK REQUESTS:
    - await page.route('**/*.png', route => route.abort())

  MODIFY REQUEST:
    - await page.route('**/api/data', route => {{
        const headers = {{ ...route.request().headers(), 'X-Custom': 'value' }};
        route.continue({{ headers }});
      }})

  WAIT FOR API:
    - const responsePromise = page.waitForResponse('**/api/**');
      await page.getByRole('button', {{ name: 'Login' }}).click();
      const response = await responsePromise;
      expect(response.status()).toBe(200);

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  DIALOG HANDLING (alerts, confirms, prompts)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - page.on('dialog', dialog => dialog.accept())
    - page.on('dialog', dialog => dialog.dismiss())
    - page.on('dialog', dialog => dialog.accept('input text'))
    - page.once('dialog', dialog => {{
        expect(dialog.message()).toBe('Are you sure?');
        dialog.accept();
      }})

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  MULTIPLE TABS / POPUPS
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - const [newPage] = await Promise.all([
        context.waitForEvent('page'),
        page.getByRole('link', {{ name: 'Open' }}).click()
      ]);
      await newPage.waitForLoadState();
      await expect(newPage).toHaveURL(/\S+/);

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  DATA EXTRACTION (for dynamic assertions)
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - const text = await locator.textContent()
    - const value = await locator.inputValue()
    - const count = await locator.count()
    - const isVisible = await locator.isVisible()
    - const isEnabled = await locator.isEnabled()
    - const isChecked = await locator.isChecked()
    - const attr = await locator.getAttribute('href')
    - const allTexts = await locator.allTextContents()
    - const allValues = await locator.allInnerTexts()
    - const boundingBox = await locator.boundingBox()

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  BEST PRACTICES
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    - When CONTEXT gives you real selectors, ALWAYS use resolveLocator(page, sel) — never sel.playwright or sel.cypress.
    - Use getByRole only for interactive elements (buttons, links, inputs) when NO selector is provided in CONTEXT.
    - DO NOT assume ARIA roles for message/notification elements.
    - Let expect() auto-wait instead of adding manual waits.
    - Use test.beforeEach for repeated setup (navigation, login).
    - Keep tests independent — no shared state between tests.
    - One logical assertion group per test — test ONE behavior.
    - Use descriptive test names: 'should show error when password is empty'.
    - Add comments for non-obvious logic only.
    - For dynamic URLs: always use buildUrl() — never paste example_values as literals.

  CRITICAL SELECTOR RULE (FINAL REMINDER):
  - NEVER write page.locator(sel.playwright) or page.locator(sel.cypress)
  - ALWAYS write resolveLocator(page, sel) for any selector from testData
  - The playwright/cypress fields are code strings, not CSS — they will crash page.locator()

  OUTPUT: Return ONLY valid TypeScript code. No markdown fences. No explanation.