services:
  test-generator:
    build:
      context: .
      args:
        RELEASE_TAG: v5.2.0
    image: ai-natural-language-tests:v5.2.0
    env_file: .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OTEL_PROVIDER: ${OTEL_PROVIDER:-grafana}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_INSTANCE_ID: ${GRAFANA_INSTANCE_ID:-}
      GRAFANA_API_TOKEN: ${GRAFANA_API_TOKEN:-}
    volumes:
      - ./cypress/e2e/generated:/app/cypress/e2e/generated
      - ./cypress/e2e/prompt-powered:/app/cypress/e2e/prompt-powered
      - ./cypress/fixtures:/app/cypress/fixtures
      - ./tests/generated:/app/tests/generated
      - ./webdriverio/tests/generated:/app/webdriverio/tests/generated
      - ./webdriverio/tests/appium-tests:/app/webdriverio/tests/appium-tests
      - ./vector_db:/app/vector_db