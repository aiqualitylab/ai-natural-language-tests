  - name: Build filtered deploy bundle
    run: |
      rm -rf .hf-deploy
      mkdir -p .hf-deploy
      mkdir -p .hf-deploy/prompt_specs

      # Required Space files
      cp [app.py](http://_vscodecontentref_/0) .hf-deploy/
      cp [requirements.txt](http://_vscodecontentref_/1) .hf-deploy/
      cp [README.md](http://_vscodecontentref_/2) .hf-deploy/

      # Runtime dependencies
      cp [qa_config.py](http://_vscodecontentref_/3) .hf-deploy/
      cp [qa_runtime.py](http://_vscodecontentref_/4) .hf-deploy/
      cp [qa_workflow.py](http://_vscodecontentref_/5) .hf-deploy/

      # Required prompt templates/specs
      cp -r prompt_specs/* .hf-deploy/prompt_specs/

  - name: Push bundle to Hugging Face Space
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    run: |
      if [ -z "$HF_TOKEN" ]; then
        echo "HF_TOKEN secret is not set."
        exit 1
      fi

      cd .hf-deploy
      git init
      git config user.email "ci@github.com"
      git config user.name "CI"
      git add -A
      git commit -m "Deploy selected files to HF Space"

      HF_REMOTE="https://aiqualitylab:${HF_TOKEN}@huggingface.co/spaces/aiqualitylab/ai-natural-language-tests"
      git branch -M main
      git remote add hf "$HF_REMOTE"
      git push hf main --force