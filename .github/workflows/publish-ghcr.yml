name: Publish Docker Image (GHCR)

# Triggers:
#   - When you push a version tag like v5.2.0 (production publish)
#   - workflow_dispatch lets you trigger it manually from GitHub UI (useful for testing)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Grant permission to read the repo and write to GitHub Packages (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code so Docker can build from it
      - name: Checkout
        uses: actions/checkout@v7

      # Step 2: Log in to GHCR using your GitHub username and a built-in token
      # GITHUB_TOKEN is automatically provided by GitHub Actions ÔÇö no manual secret needed
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Build the Docker image and push it to GHCR
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-natural-language-tests:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ai-natural-language-tests:latest
