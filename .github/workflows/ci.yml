name: AI Test Generation and Evaluation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      requirements:
        description: 'Test requirements (comma separated)'
        required: true
        default: 'Test user login with valid credentials, Test login with invalid credentials'
      target_url:
        required: false
        default: 'https://the-internet.herokuapp.com/login'
      llm_provider:
        description: 'LLM provider: openai, anthropic, google, ollama, local-openai'
        required: false
        default: 'openai'

env:
  REQS: ${{ github.event.inputs.requirements || 'Test user login with valid credentials, Test login with invalid credentials' }}
  URL:  ${{ github.event.inputs.target_url   || 'https://the-internet.herokuapp.com/login' }}

jobs:

  # ── JOB 1: Secret scanning — runs before everything else ─────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # ── JOB 2: Unit tests — core logic validation (no external deps) ─────────
  unit-tests:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.14' }
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/unit_tests.py -v

  # ── JOB 3: NLP baseline — no API key ─────────────────────────────────────
  nlp-baseline:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.14' }
      - run: pip install -r requirements.txt
      - run: python ragas_nlp_evaluator.py --dataset test_dataset.json

  # ── JOB 4: Generate → Ragas → Run (3 frameworks in parallel) ─────────────
  test:
    needs: nlp-baseline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [cypress, playwright, webdriverio]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt && npm install
          [ "${{ matrix.framework }}" = "playwright"   ] && npm install --save-dev @playwright/test && npx playwright install chromium || true
          [ "${{ matrix.framework }}" = "webdriverio"  ] && npm install --save-dev @wdio/cli @wdio/local-runner @wdio/mocha-framework || true

      - name: Generate tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          QUOTED=$(echo "$REQS" | sed 's/,/" "/g;s/^/"/;s/$/"/')
          eval python qa_automation.py --framework ${{ matrix.framework }} $QUOTED --url $URL

      - name: Ragas evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          case "${{ matrix.framework }}" in
            playwright)  DIR="tests/generated";              EXT="spec.ts" ;;
            webdriverio) DIR="webdriverio/tests/generated";  EXT="js"      ;;
            *)           DIR="cypress/e2e/generated";         EXT="cy.js"   ;;
          esac
          for f in $DIR/**/*.$EXT; do
            [ -f "$f" ] && python ragas_evaluator.py "$REQS" --test "$f" --url "$URL" || true
          done

      - name: Run tests
        id: run
        continue-on-error: true
        run: |
          case "${{ matrix.framework }}" in
            playwright)  npx playwright test tests/generated/ 2>&1 | tee test-output.log ;;
            webdriverio) npx wdio run wdio.conf.js            2>&1 | tee test-output.log ;;
            *)           npx cypress run --spec "cypress/e2e/generated/**/*.cy.js" 2>&1 | tee test-output.log ;;
          esac

      - name: AI failure analysis
        if: steps.run.outcome == 'failure'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python qa_automation.py --analyze -f test-output.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.framework }}
          path: |
            cypress/e2e/generated/
            tests/generated/
            webdriverio/tests/generated/
            test-output.log

  # ── JOB 5 (OPTIONAL): Test with Ollama (Privacy-first local inference) ────
  # Runs when: workflow_dispatch with llm_provider=ollama, or manual trigger
  # Uses Ollama service container for local LLM inference (no cloud APIs)
  test-with-ollama:
    needs: nlp-baseline
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.llm_provider == 'ollama' || contains(github.event.head_commit.message, '[ollama]') }}
    strategy:
      fail-fast: false
      matrix:
        framework: [cypress, playwright]

    services:
      ollama:
        image: ollama/ollama:latest
        options: >-
          --health-cmd "curl -f http://localhost:11434/api/tags || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt && npm install
          [ "${{ matrix.framework }}" = "playwright" ] && npm install --save-dev @playwright/test && npx playwright install chromium || true

      - name: Pull Ollama model
        run: |
          echo "Pulling Mistral model (use 'neural-chat' for smaller model)..."
          curl -X POST http://localhost:11434/api/pull -d '{"name": "neural-chat"}'

      - name: Generate tests with Ollama
        env:
          OLLAMA_BASE_URL: http://localhost:11434/v1
          OLLAMA_MODEL: neural-chat
        run: |
          QUOTED=$(echo "$REQS" | sed 's/,/" "/g;s/^/"/;s/$/"/')
          eval python qa_automation.py --framework ${{ matrix.framework }} --llm ollama $QUOTED --url $URL

      - name: Run tests
        id: run
        continue-on-error: true
        run: |
          case "${{ matrix.framework }}" in
            playwright)  npx playwright test tests/generated/ 2>&1 | tee test-output.log ;;
            *)           npx cypress run --spec "cypress/e2e/generated/**/*.cy.js" 2>&1 | tee test-output.log ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-ollama-${{ matrix.framework }}
          path: |
            cypress/e2e/generated/
            tests/generated/
            test-output.log
