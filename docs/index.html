<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Natural Language Tests — Generate Tests from Plain English</title>
  <meta name="description" content="Generate Cypress, Playwright & Selenium tests from natural language using LangGraph workflows. Open source by AI Quality Lab.">
  <meta property="og:title" content="AI Natural Language Tests">
  <meta property="og:description" content="Describe tests in plain English. Get production-ready code.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234a7cff'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='14' font-weight='bold' fill='%230a0b0f' font-family='monospace'>NL</text></svg>">

  <!-- Google Analytics — replace G-XXXXXXXXXX with your Measurement ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <!-- Docsify dark theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">

  <style>
    :root {
      --base-background-color: #0a0b0f;
      --cover-background-color: #0a0b0f;
    }
  </style>
</head>
<body>

  <div id="app">
    <p style="text-align:center; padding:60px 20px; color:#888; font-family:system-ui;">
      Loading README from GitHub...<br><br>
      <small>This page fetches <code>README.md</code> from
      <a href="https://github.com/aiqualitylab/ai-natural-language-tests">github.com/aiqualitylab/ai-natural-language-tests</a>
      and renders it here. If you see this message, the page needs internet access to
      <code>raw.githubusercontent.com</code> and <code>cdn.jsdelivr.net</code>.</small>
    </p>
  </div>

  <script>
    window.$docsify = {
      name: 'AI Natural Language Tests',
      repo: 'https://github.com/aiqualitylab/ai-natural-language-tests',

      // Fetch README.md from repo main branch
      homepage: 'https://raw.githubusercontent.com/aiqualitylab/ai-natural-language-tests/main/README.md',

      loadSidebar: false,
      loadNavbar: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,

      darklightTheme: {
        defaultTheme: 'dark'
      },

      // Mermaid code blocks → rendered diagrams
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    }
  </script>

  <!-- Mermaid — load BEFORE Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'dark' });</script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-ga@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>

  <!-- Render mermaid after Docsify loads page -->
  <script>
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
      hook.doneEach(function() {
        if (typeof mermaid !== 'undefined') {
          mermaid.run({ querySelector: '.mermaid' });
        }
      });
    });
  </script>

</body>
</html>
